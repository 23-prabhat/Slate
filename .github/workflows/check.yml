name: Native editor checks
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  fedora:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install Fedora runtime and build tools
        run: dnf install -y git python3 python3-pyside6 python3-enchant hunspell-en-US dejavu-sans-fonts make rpm-build tar gzip desktop-file-utils appstream poppler-utils
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test native editor and process recovery
        run: make test
      - name: Validate desktop entry
        run: desktop-file-validate packaging/desktop/org.local.FolioNotepad.desktop
      - name: Build RPM
        run: make rpm
      - uses: actions/upload-artifact@v7
        with:
          name: folio-notepad-fedora
          path: dist/*.rpm
