name: Native editor checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fedora:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Install Fedora runtime and build tools
        run: dnf install -y python3 python3-pyside6 python3-enchant hunspell-en-US make rpm-build desktop-file-utils appstream poppler-utils
      - name: Test native editor and process recovery
        run: make test
      - name: Validate desktop entry
        run: desktop-file-validate packaging/desktop/org.local.FolioNotepad.desktop
      - name: Build RPM
        run: make rpm
      - uses: actions/upload-artifact@v4
        with:
          name: folio-notepad-fedora
          path: dist/*.rpm
